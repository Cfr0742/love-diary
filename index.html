<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>💕 我们的纪念册</title>
    <link rel="stylesheet" href="style.css?v=2">
</head>
<body>

<!-- ========== 封面页（粒子爱心） ========== -->
<div id="cover-screen" class="screen active">
    <canvas id="heart-canvas"></canvas>
    <div class="cover-content">
        <h1 id="cover-title" contenteditable="true">💕 我们的纪念册</h1>
        <p class="cover-subtitle">点击标题可以修改文字哦~</p>
        <button class="enter-btn" onclick="enterMain()">✨ 进入我们的纪念册 ✨</button>
    </div>
</div>

<!-- ========== 密码页 ========== -->
<div id="password-screen" class="screen">
    <div class="password-box">
        <h2>🔒 这是属于我们的小秘密</h2>
        <input type="password" id="password-input" placeholder="请输入密码">
        <button onclick="checkPassword()">进入</button>
        <p class="hint">忘记密码？清除浏览器数据即可~</p>
    </div>
</div>

<!-- ========== 主页面（照片相册风） ========== -->
<div id="main-screen" class="screen">

    <!-- 顶部标题区 -->
    <header class="main-header">
        <h1 id="main-title" contenteditable="true">💕 我们的纪念册</h1>
        <p id="opening-words" contenteditable="true">这是我们的故事，从此刻开始记录...</p>
        <div class="together-badge">
            我们在一起已经 <span id="together-days">0</span> 天啦
        </div>
    </header>

    <div class="main-container">

        <!-- 纪念日 -->
        <section class="album-card">
            <h2>🎂 纪念日</h2>
            <div class="input-row">
                <input type="text" id="anni-name" placeholder="纪念日名称">
                <input type="date" id="anni-date">
                <button onclick="addAnniversary()">添加</button>
            </div>
            <div id="anniversary-list" class="card-list"></div>
        </section>

        <!-- 日常记录 -->
        <section class="album-card">
            <h2>📝 情侣日常</h2>
            <div class="input-row">
                <input type="date" id="daily-date">
                <input type="text" id="daily-content" placeholder="今天一起做了什么？">
                <select id="daily-mood">
                    <option value="😊">😊 开心</option>
                    <option value="😘">😘 甜蜜</option>
                    <option value="🥰">🥰 幸福</option>
                    <option value="😎">😎 酷</option>
                    <option value="🤗">🤗 温暖</option>
                    <option value="😋">😋 好吃</option>
                    <option value="🥳">🥳 庆祝</option>
                </select>
                <button onclick="addDaily()">记录</button>
            </div>
            <div id="daily-list" class="card-list timeline"></div>
        </section>

        <!-- 照片墙 -->
        <section class="album-card">
            <h2>📷 照片墙</h2>
            <div class="input-row">
                <input type="text" id="photo-url" placeholder="粘贴图片链接（或点击右侧上传）">
                <input type="file" id="photo-file" accept="image/*" onchange="uploadPhoto(this)">
                <button onclick="document.getElementById('photo-file').click()">📁 上传本地图</button>
                <button onclick="addPhotoUrl()">添加链接</button>
            </div>
            <p class="tip">💡 建议先用微博/小红书/QQ空间传图，复制图片链接贴进来，这样不占用空间</p>
            <div id="photo-grid" class="photo-grid"></div>
        </section>

        <!-- 留言板 -->
        <section class="album-card">
            <h2>💌 悄悄话</h2>
            <div class="input-row">
                <input type="text" id="msg-author" placeholder="署名（如：宝贝）">
                <input type="text" id="msg-content" placeholder="想对TA说点什么...">
                <button onclick="addMessage()">留言</button>
            </div>
            <div id="message-list" class="card-list message-list"></div>
        </section>

        <!-- 日历 -->
        <section class="album-card">
            <h2>📅 恋爱日历</h2>
            <div class="calendar-nav">
                <button onclick="changeMonth(-1)">◀</button>
                <span id="calendar-title">2024年1月</span>
                <button onclick="changeMonth(1)">▶</button>
            </div>
            <div class="calendar-grid" id="calendar-grid"></div>
        </section>

        <!-- 底部工具栏 -->
        <section class="album-card settings-card">
            <h2>⚙️ 设置 & 分享</h2>

            <div class="setting-item">
                <label>在一起起始日期：</label>
                <input type="text" id="start-date" placeholder="例如：2004-05-20" onchange="updateStartDate()">
            </div>

            <div class="setting-item">
                <label>页面密码（留空则不需要）：</label>
                <input type="text" id="set-password" placeholder="设置密码" onchange="updatePassword()">
            </div>

            <div class="setting-item">
                <label>背景音乐链接（MP3地址）：</label>
                <input type="text" id="music-url" placeholder="https://...mp3" onchange="updateMusic()">
                <audio id="bg-music" loop></audio>
                <button onclick="toggleMusic()" id="music-btn">🎵 播放/暂停</button>
            </div>

            <div class="setting-item share-box">
                <button onclick="generateShareLink()" class="share-btn">🔗 生成分享链接发给TA</button>
                <input type="text" id="share-link" readonly placeholder="点击按钮生成链接">
            </div>
        </section>

    </div>

    <footer class="main-footer">
        <p>💕 属于我们的纪念册 · 点击任意标题/文字都可以修改哦</p>
    </footer>
</div>

<script src="app.v2.js"></script>
</body>
</html>
